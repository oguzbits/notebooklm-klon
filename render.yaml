# Render Blueprint: one free web service from the Dockerfile. The database is Neon (see README).
# Values marked sync: false are asked for when the Blueprint is created; set them in the dashboard.
services:
  - type: web
    name: notebooklm-klon
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # The direct Neon connection string (no "-pooler" in the host).
      - key: DATABASE_URL
        sync: false
      # Use the key of the separate Google project for the demo, not the one used for building.
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: PARSE_MODEL
        sync: false
      - key: EMBEDDING_MODEL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # The public URL of this service, for example https://notebooklm-klon.onrender.com. Set it
      # after the first deploy shows the URL, then redeploy.
      - key: BETTER_AUTH_URL
        sync: false
