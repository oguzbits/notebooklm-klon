# Local Postgres with pgvector for the database tests (`pnpm db:up`, then `pnpm test:db`) and the
# browser tests (`pnpm e2e`, database nlm_e2e).
# Data lives in memory (tmpfs) and is gone after `pnpm db:down`. The credentials are for this
# throwaway container only.
services:
  db:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: nlm
      POSTGRES_PASSWORD: nlm
      POSTGRES_DB: nlm_test
    ports:
      - '54329:5432'
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./docker/init-e2e.sql:/docker-entrypoint-initdb.d/init-e2e.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nlm -d nlm_test']
      interval: 2s
      timeout: 3s
      retries: 20

  # An S3-compatible object store for the cover images (`pnpm db:up` starts it with the database).
  # SeaweedFS, because it is maintained and Apache-2.0 (MinIO's community edition was archived in
  # April 2026). The app only speaks the S3 protocol, so any S3 service works. The credentials in
  # docker/s3.json are for this throwaway container only; data is in memory.
  s3:
    # Pinned to the version the tests ran against; look at the tags before moving it.
    image: chrislusf/seaweedfs:4.48
    # Every bucket gets a volume of its own, so allow several small ones on this small disk.
    command: server -dir=/data -volume.max=50 -master.volumeSizeLimitMB=64 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '8333:8333'
    tmpfs:
      - /data
    volumes:
      - ./docker/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # Any HTTP answer, even a refusal, means the S3 port is up.
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:8333']
      interval: 2s
      timeout: 3s
      retries: 30
