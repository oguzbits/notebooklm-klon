name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs; the tag is noted in the comment.
# pnpm/setup reads the pnpm version from package.json (packageManager)
# and the Node version from .nvmrc, then runs `pnpm install --frozen-lockfile`.
jobs:
  quality:
    name: Typecheck, lint, architecture, dead code, duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm format:check
      - run: pnpm check

  test:
    name: Tests (offline, no real API calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm test

  test-db:
    name: Tests (Postgres with pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: nlm
          POSTGRES_PASSWORD: nlm
          POSTGRES_DB: nlm_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U nlm -d nlm_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      # The object store of the cover images; Postgres comes from the service above.
      - run: docker compose up -d --wait s3
      - run: pnpm test:db

  e2e:
    name: Browser test (Playwright, fake model and embedding)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: nlm
          POSTGRES_PASSWORD: nlm
          POSTGRES_DB: nlm_e2e
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U nlm -d nlm_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm --filter @nlm/web exec playwright install --with-deps chromium
      - run: pnpm e2e

  build:
    name: Build api and web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config auto --error apps packages
