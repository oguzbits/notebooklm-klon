name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs; the tag is noted in the comment.
# pnpm/setup reads the pnpm version from package.json (packageManager)
# and the Node version from .nvmrc, then runs `pnpm install --frozen-lockfile`.
jobs:
  quality:
    name: Typecheck, lint, architecture, dead code, duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm format:check
      - run: pnpm check

  test:
    name: Tests (offline, no real API calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm test

  build:
    name: Build api and web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    # Not verified locally (semgrep is not installed here). Report-only until the first run
    # shows the findings are actionable; then remove continue-on-error to make it blocking.
    continue-on-error: true
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config auto --error apps packages
