name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs; the tag is noted in the comment.
# pnpm/setup reads the pnpm version from package.json (packageManager)
# and the Node version from .nvmrc, then runs `pnpm install --frozen-lockfile`.
jobs:
  quality:
    name: Typecheck, lint, architecture, dead code, duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm format:check
      - run: pnpm check
      # A change to a path in docs/docs-map.json needs its document or "Docs: n/a, <reason>".
      - name: Docs map
        env:
          RANGE: ${{ github.event.pull_request.base.sha || github.event.before }}..${{ github.sha }}
        run: node scripts/audit/audit-docs-map.mjs --range "$RANGE"
      # Production dependencies only: the open moderate finding is a dev-server issue in drizzle-kit.
      - run: pnpm audit --prod --audit-level=high

  test:
    name: Tests (offline, no real API calls)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm test

  test-db:
    name: Tests (Postgres with pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: nlm
          POSTGRES_PASSWORD: nlm
          POSTGRES_DB: nlm_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U nlm -d nlm_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      # The object store of the cover images; Postgres comes from the service above.
      - run: docker compose up -d --wait s3
      - run: pnpm test:db

  e2e:
    name: Browser test (Playwright, fake model and embedding)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: nlm
          POSTGRES_PASSWORD: nlm
          POSTGRES_DB: nlm_e2e
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U nlm -d nlm_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm --filter @nlm/web exec playwright install --with-deps chromium
      - run: pnpm e2e

  build:
    name: Build api and web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build

  trivy:
    name: Trivy (dependencies, secrets, Dockerfile) and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Trivy 0.76.0 by digest, run as a container: 0.70 (the version inside trivy-action v0.36.0) did not read
      # the workspace lockfile. Fails on fixable HIGH and CRITICAL findings; the SBOM lists every package.
      - name: Scan
        run: |
          docker run --rm -v "$PWD":/w -w /w aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --skip-version-check .
      - name: SBOM
        run: |
          docker run --rm -v "$PWD":/w -w /w aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            fs --format cyclonedx --output sbom.cdx.json --skip-version-check .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config auto --error apps packages
