name: Deploy

# Runs after CI went green on main. The image is built here and sent over SSH, so the server needs
# no access to the repository and no registry. Secrets (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST        host name of the server
#   DEPLOY_SSH_KEY     private key of the user "deploy"
#   DEPLOY_KNOWN_HOSTS the line of the server from `ssh-keyscan` (pins the host key)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, ship and start
    # Only a CI run of a push to this repository deploys: a pull request from a fork also ends up as
    # a workflow_run on main and must never reach the server.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    env:
      TARGET: deploy@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Prepare SSH
        # The secrets reach the script as environment variables, never pasted into its text.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
      - name: Build image
        run: docker build -t nlm-app:current .
      - name: Copy files and image
        run: |
          scp deploy/docker-compose.prod.yml deploy/Caddyfile deploy/backup.sh "$TARGET:/srv/nlm/"
          # The running image stays as "previous" for a rollback (docs/DEPLOYMENT.md); the first deploy has none.
          ssh "$TARGET" 'if docker image inspect nlm-app:current >/dev/null 2>&1; then docker tag nlm-app:current nlm-app:previous; fi'
          docker save nlm-app:current | gzip | ssh "$TARGET" 'gunzip | docker load'
      - name: Dump the database
        # The app migrates forward when it starts, so a dump of the old state is the way back. The
        # first deploy has no database yet; any later failure stops the deploy.
        run: |
          ssh "$TARGET" 'cd /srv/nlm && if docker compose -f docker-compose.prod.yml --env-file server.env ps --status running --quiet db | grep -q .; then bash backup.sh; fi'
      - name: Start
        id: start
        run: |
          # Compose does not restart Caddy when only the mounted Caddyfile changed, so it is reloaded.
          ssh "$TARGET" 'cd /srv/nlm && chmod +x backup.sh && docker compose -f docker-compose.prod.yml --env-file server.env up -d --wait --remove-orphans && docker image prune -f
          docker compose -f docker-compose.prod.yml --env-file server.env exec -T caddy caddy reload --config /etc/caddy/Caddyfile'
      - name: Check from outside
        id: check
        # The same way a visitor arrives: DNS, certificate, Caddy and the app.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "https://$DEPLOY_HOST/health"
      - name: Roll back
        # Only when the new version did not start or does not answer. Database migrations stay applied
        # (docs/DEPLOYMENT.md); the job stays red so the failure is seen.
        if: ${{ failure() && (steps.start.outcome == 'failure' || steps.check.outcome == 'failure') }}
        run: |
          ssh "$TARGET" 'cd /srv/nlm && docker image inspect nlm-app:previous >/dev/null && docker tag nlm-app:previous nlm-app:current && docker compose -f docker-compose.prod.yml --env-file server.env up -d --wait app'
